<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>お問い合わせ | K.A portfolio</title>
  </head>
  <body>
    <header>
      <a class="logo" href="../index.html">Kazuyuki Asari</a>
      <button class="nav-toggle" id="navToggle" aria-label="メニュー">
        &#9776;
      </button>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="../index.html#ABOUT">ABOUT</a></li>
          <li><a href="../index.html#SKILL">SKILL</a></li>
          <li><a href="../index.html#PROJECTS">PROJECTS</a></li>
          <li><a href="../index.html#CONTACT">CONTACT</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="container">
        <div class="section-head">
          <h2>ContactForm</h2>
        </div>
        <div class="contact-card">
          <p>
            下記のフォーム、またはメールアドレス・GitHubよりご連絡ください。
          </p>

          <form
            class="contact-form"
            name="contact"
            method="POST"
            data-netlify="true"
          >
            <input type="hidden" name="form-name" value="contact" />
            <div class="form-row">
              <label for="name">お名前</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-row">
              <label for="email">メールアドレス</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-row">
              <label for="subject">件名</label>
              <input type="text" id="subject" name="subject" required />
            </div>
            <div class="form-row">
              <label for="message">お問い合わせ内容</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn-submit">送信する</button>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <a class="back-link" href="../index.html">← TOPに戻る</a>
      <small>© 2026 Kazuyuki Asari. All rights reserved.</small>
    </footer>

    <script src="../js/script.js"></script>
  </body>
</html>
